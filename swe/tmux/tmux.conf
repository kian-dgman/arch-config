# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# KEY BINDINGS
# ============================================

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position top

# Status bar colors
set -g status-style 'bg=#000000 fg=#8b949e'
set -g status-left-length 20

# Status bar content
set -g status-left '#[fg=#30363d,bold] [#S]'
set -g status-right ''

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#ffffff,bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#ffffff'

# Message styling
set -g message-style 'bg=#ffffff fg=#000000 bold'

# Force the cursor color to Black
set -ga terminal-overrides ',*:Cs=\E]12;#000000\007'

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
